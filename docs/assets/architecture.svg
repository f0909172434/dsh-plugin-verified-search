<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">dsh-plugin-verified-search evidence workflow</title>
  <desc id="desc">A bounded flow from a dated user question through deterministic JSON tools or verified research, safe retrieval, exact evidence, and terminal synthesis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#28c7a5"/>
      <stop offset="1" stop-color="#4ca6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#76d7c4"/>
    </marker>
    <style>
      .title{font:700 29px Inter,Segoe UI,sans-serif;fill:#f7fbff}.subtitle{font:400 16px Inter,Segoe UI,sans-serif;fill:#aac5dd}.box{fill:#102f4b;stroke:#315b78;stroke-width:2}.box2{fill:#0c3d42;stroke:#2ca58d;stroke-width:2}.box3{fill:#25294d;stroke:#7179c9;stroke-width:2}.label{font:700 19px Inter,Segoe UI,sans-serif;fill:#f7fbff}.small{font:400 14px Inter,Segoe UI,sans-serif;fill:#c7dcec}.pill{font:600 13px Inter,Segoe UI,sans-serif;fill:#dffbf4}.arrow{fill:none;stroke:#76d7c4;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <rect x="52" y="42" width="8" height="54" rx="4" fill="url(#accent)"/>
  <text x="78" y="69" class="title">Verified search is a bounded evidence workflow</text>
  <text x="78" y="94" class="subtitle">Current time, source scope, exact excerpts, deterministic JSON, and honest unresolved claims</text>

  <g filter="url(#shadow)">
    <rect class="box" x="55" y="150" width="220" height="126" rx="18"/>
    <text x="80" y="185" class="label">1 · Dated question</text>
    <text x="80" y="215" class="small">Absolute as-of time</text>
    <text x="80" y="239" class="small">Typed claims and domains</text>
    <rect x="80" y="251" width="142" height="18" rx="9" fill="#174e62"/>
    <text x="91" y="264" class="pill">dsh-time-context</text>

    <rect class="box3" x="350" y="128" width="270" height="174" rx="18"/>
    <text x="375" y="164" class="label">2 · Choose a bounded tool</text>
    <text x="375" y="194" class="small">verified_json_selection</text>
    <text x="375" y="218" class="small">verified_json_numeric_extrema</text>
    <text x="375" y="242" class="small">verified_json_projection</text>
    <text x="375" y="266" class="small">verified_search / verified_research</text>

    <rect class="box2" x="700" y="128" width="445" height="174" rx="18"/>
    <text x="725" y="164" class="label">3 · Retrieve within hard boundaries</text>
    <text x="725" y="194" class="small">Allowlisted HTTPS · public IPs · DNS-pinned socket</text>
    <text x="725" y="218" class="small">Per-hop redirect validation · bytes/time/media caps</text>
    <text x="725" y="242" class="small">Strict JSON parsing · exact numeric lexemes</text>
    <text x="725" y="266" class="small">Provider snippets remain discovery metadata</text>

    <rect class="box2" x="205" y="384" width="390" height="164" rx="18"/>
    <text x="230" y="421" class="label">4 · Retain auditable evidence</text>
    <text x="230" y="451" class="small">Exact contiguous excerpt + offsets</text>
    <text x="230" y="475" class="small">retrieved_at + normalized SHA-256</text>
    <text x="230" y="499" class="small">Per-claim covered / blocked / missing</text>
    <text x="230" y="523" class="small">All remote text marked untrusted</text>

    <rect class="box3" x="700" y="384" width="335" height="164" rx="18"/>
    <text x="725" y="421" class="label">5 · Synthesize once</text>
    <text x="725" y="451" class="small">Answer only from retained evidence</text>
    <text x="725" y="475" class="small">Label every unresolved claim</text>
    <text x="725" y="499" class="small">Block shell/search fallback this turn</text>
    <rect x="725" y="516" width="183" height="18" rx="9" fill="#393f78"/>
    <text x="736" y="529" class="pill">turn-scoped convergence</text>
  </g>

  <path class="arrow" d="M275 213h65"/>
  <path class="arrow" d="M620 213h70"/>
  <path class="arrow" d="M923 310v45c0 18-15 29-33 29H595"/>
  <path class="arrow" d="M595 466h95"/>
  <text x="68" y="594" class="subtitle">Workflow verification ≠ a guarantee that an index, publisher, or final answer is always correct.</text>
</svg>
