<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
  <title id="title">Observed hard-search benchmark improvement</title>
  <desc id="desc">The pre-fix 600-second experiment resolved zero of sixteen requested fields. The current experiment resolved fourteen of sixteen, including eight of eight for Go and six of eight for the EU AI Act task.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f9fc"/><stop offset="1" stop-color="#e9f4f4"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#13a88a"/><stop offset="1" stop-color="#2f80ed"/></linearGradient>
    <style>
      .title{font:700 29px Inter,Segoe UI,sans-serif;fill:#102a43}.sub{font:400 15px Inter,Segoe UI,sans-serif;fill:#526d82}.label{font:700 18px Inter,Segoe UI,sans-serif;fill:#17324d}.value{font:800 25px Inter,Segoe UI,sans-serif;fill:#102a43}.note{font:500 14px Inter,Segoe UI,sans-serif;fill:#526d82}.axis{stroke:#b9ccda;stroke-width:1}.tick{font:500 13px Inter,Segoe UI,sans-serif;fill:#6c8295}
    </style>
  </defs>
  <rect width="1200" height="530" rx="24" fill="url(#bg)"/>
  <text x="58" y="58" class="title">Observed completion on two difficult, official-source tasks</text>
  <text x="58" y="84" class="sub">Requested fields resolved with retained evidence · one observed run per configuration · 600 s outer cap</text>

  <line x1="305" y1="124" x2="305" y2="362" class="axis"/>
  <line x1="505" y1="124" x2="505" y2="362" class="axis"/>
  <line x1="705" y1="124" x2="705" y2="362" class="axis"/>
  <line x1="905" y1="124" x2="905" y2="362" class="axis"/>
  <line x1="1105" y1="124" x2="1105" y2="362" class="axis"/>
  <text x="298" y="385" class="tick">0</text><text x="497" y="385" class="tick">4</text><text x="697" y="385" class="tick">8</text><text x="892" y="385" class="tick">12</text><text x="1092" y="385" class="tick">16</text>

  <text x="58" y="166" class="label">Pre-fix experiment</text>
  <rect x="305" y="137" width="800" height="42" rx="12" fill="#d9e3ea"/>
  <rect x="305" y="137" width="5" height="42" rx="3" fill="#9aaebd"/>
  <text x="325" y="166" class="value">0 / 16</text>

  <text x="58" y="246" class="label">Current experiment</text>
  <rect x="305" y="217" width="800" height="42" rx="12" fill="#d9e3ea"/>
  <rect x="305" y="217" width="700" height="42" rx="12" fill="url(#bar)"/>
  <text x="1020" y="246" class="value">14 / 16</text>

  <text x="58" y="326" class="label">Task breakdown</text>
  <rect x="305" y="297" width="400" height="42" rx="12" fill="#13a88a"/>
  <rect x="705" y="297" width="300" height="42" rx="12" fill="#2f80ed"/>
  <rect x="1005" y="297" width="100" height="42" rx="12" fill="#d9e3ea"/>
  <text x="435" y="325" class="value" fill="#fff">Go 8 / 8</text>
  <text x="785" y="325" class="value" fill="#fff">EU 6 / 8</text>

  <rect x="58" y="420" width="1084" height="70" rx="15" fill="#fff" stroke="#cadbe6"/>
  <text x="80" y="449" class="note">Grounded precision for answered requested fields: 14 / 14 (100%). Unsupported requested assertions: 0.</text>
  <text x="80" y="473" class="note">Latency remains high: Go 317 s; EU 307 s. This is experimental evidence, not a standardized benchmark or production SLO.</text>
</svg>
