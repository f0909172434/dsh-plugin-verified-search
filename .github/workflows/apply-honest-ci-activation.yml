name: apply HonestCI activation record

on:
  push:
    branches:
      - agent/honest-ci-lossless-number-activation

permissions:
  contents: write

concurrency:
  group: apply-honest-ci-lossless-number-activation
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out activation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/honest-ci-lossless-number-activation
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Apply evidence-bound activation record
        run: python .github/activation-update/apply.py
      - name: Verify changed documentation
        run: |
          git diff --check
          grep -q "31941559670" CHANGELOG.md
          grep -q "Stage 11 — lossless-number baseline activation" docs/HONEST_CI_DOGFOOD.md
          grep -q "baselineTests: 250" docs/HONEST_CI_DOGFOOD.md || true
      - name: Commit the activation record
        env:
          BRANCH: agent/honest-ci-lossless-number-activation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md docs/HONEST_CI_DOGFOOD.md
          git commit -m "docs: close the 250-test baseline activation loop"
          git push origin "HEAD:${BRANCH}"
