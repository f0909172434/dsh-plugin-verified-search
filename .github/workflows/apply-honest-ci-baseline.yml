name: apply HonestCI baseline evidence update

on:
  push:
    branches:
      - agent/honest-ci-lossless-number-baseline

permissions:
  contents: write

concurrency:
  group: apply-honest-ci-lossless-number-baseline
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out baseline branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/honest-ci-lossless-number-baseline
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Apply evidence-bound baseline update
        run: python .github/baseline-update/apply.py
      - name: Verify changed files
        run: |
          git diff --check
          python -m json.tool .honest-ci/baseline.json >/dev/null
          grep -q "31941012664" CHANGELOG.md
          grep -q "Stage 10 — lossless-number baseline revision" docs/HONEST_CI_DOGFOOD.md
      - name: Commit the baseline revision
        env:
          BRANCH: agent/honest-ci-lossless-number-baseline
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .honest-ci/baseline.json CHANGELOG.md docs/HONEST_CI_DOGFOOD.md
          git commit -m "ci: advance HonestCI baseline after lossless-number extraction"
          git push origin "HEAD:${BRANCH}"
