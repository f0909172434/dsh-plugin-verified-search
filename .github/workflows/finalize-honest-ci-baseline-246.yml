name: finalize 246-test HonestCI baseline proposal

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

jobs:
  finalize:
    if: github.head_ref == 'agent/honest-ci-json-primitives-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the source branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
          persist-credentials: true
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Type-check source and tests
        run: pnpm run check
      - name: Run all tests
        run: pnpm test
      - name: Build distributable artifacts
        run: pnpm run build
      - name: Reproduce the frozen offline corpus
        run: pnpm run evaluate:offline
      - name: Require committed artifacts to reproduce
        run: git diff --exit-code -- lib
      - name: Verify package contents without lifecycle scripts
        run: npm pack --dry-run --ignore-scripts --json
      - name: Remove operational files and merge the validated proposal
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: python .github/finalize-honest-ci-baseline-246.py
