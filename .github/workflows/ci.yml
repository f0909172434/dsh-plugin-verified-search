name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality and package contract (Node 22.19)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Type-check source and tests
        run: pnpm run check
      - name: Run tests through HonestCI
        id: honest_ci
        uses: f0909172434/honest-ci@4ee4e30b283c219ff42e75606e692f34c91ba826 # v1.0.4
        with:
          command: pnpm test -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml
          config: honest-ci.yml
          github-token: ${{ github.token }}
          evidence-output: .honest-ci/evidence.json
      - name: Upload HonestCI evidence and JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: honest-ci-evidence-${{ github.run_attempt }}
          path: |
            .honest-ci/evidence.json
            reports/junit.xml
          if-no-files-found: warn
          retention-days: 30
      - name: Build distributable artifacts
        run: pnpm run build
      - name: Require committed prebuilt artifacts to reproduce
        run: git diff --exit-code -- lib
      - name: Verify package contents without lifecycle scripts
        run: npm pack --dry-run --ignore-scripts --json

  compatibility:
    name: compatibility (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '22.19.0'
          - os: windows-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Type-check source and tests
        run: pnpm run check
      - name: Run full test suite
        run: pnpm test
      - name: Verify build compatibility
        run: pnpm run build
